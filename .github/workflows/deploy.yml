name: Deploy loyalty card to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DB: ${{ secrets.LOYALTY_D1_DATABASE_ID }}
          CF_STAFF: ${{ secrets.LOYALTY_STAFF_KEY }}
        run: |
          for name in CF_TOKEN CF_ACCOUNT CF_DB CF_STAFF; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required deployment secret: $name"
              exit 1
            fi
          done
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Set database ID in configuration
        env:
          DATABASE_ID: ${{ secrets.LOYALTY_D1_DATABASE_ID }}
        run: |
          node -e 'const fs=require("fs");const p="wrangler.jsonc";let s=fs.readFileSync(p,"utf8");s=s.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID",process.env.DATABASE_ID);fs.writeFileSync(p,s)'
      - name: Apply database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute loyalty --remote --file=./schema.sql --yes
      - name: Configure staff secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAFF_KEY: ${{ secrets.LOYALTY_STAFF_KEY }}
        run: printf '%s' "$STAFF_KEY" | npx wrangler secret put STAFF_KEY
      - name: Deploy application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
